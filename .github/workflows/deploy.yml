name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the weekly catalogue refresh: a push made with GITHUB_TOKEN does not
  # trigger workflows, so the refresh has to invoke this one directly.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            valentine/package-lock.json
            mugshop/package-lock.json

      - name: Install dependencies (valentine)
        run: npm ci
        working-directory: valentine

      - name: Lint (valentine)
        run: npm run lint
        working-directory: valentine

      - name: Test (valentine)
        run: npm test
        working-directory: valentine

      - name: Build (valentine)
        run: npm run build
        working-directory: valentine

      - name: Install dependencies (mugshop)
        run: npm ci
        working-directory: mugshop

      - name: Lint (mugshop)
        run: npm run lint
        working-directory: mugshop

      - name: Test (mugshop)
        run: npm test
        working-directory: mugshop

      - name: Build (mugshop)
        run: npm run build
        working-directory: mugshop

      - name: Assemble site
        run: |
          rm -rf _site
          cp -r valentine/dist _site
          cp -r mugshop/dist _site/mugshop

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
